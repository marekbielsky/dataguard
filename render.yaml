services:
  - type: web
    name: dataguard-web
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: corepack enable && corepack prepare pnpm@12.21.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @dataguard/web start
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - .nvmrc
    envVars:
      - key: NODE_VERSION
        value: "24.17.0"
      - key: PNPM_VERSION
        value: "12.21.0"
